<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kamera Wajah - SDN 004 Bontang Barat</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#233650;display:flex;justify-content:center}main{max-width:480px;width:100%;padding:22px}h2{font-size:22px}video{width:100%;background:#18202b;aspect-ratio:4/3;object-fit:cover;border-radius:16px;transform:scaleX(-1)}p{line-height:1.5}#status{background:white;border-radius:10px;padding:15px;margin-top:14px}button{padding:14px;border:0;border-radius:10px;background:#187ee9;color:white;font-weight:bold;width:100%;margin-top:14px}button:disabled{background:#9da8ba}</style>
</head><body><main><h2>Verifikasi Foto Wajah</h2><p>Izinkan kamera depan. Foto akan diambil otomatis setelah 3 detik, tanpa mengambil foto dari galeri.</p>
<video id="v" autoplay muted playsinline></video><p id="status">Meminta izin kamera…</p><button id="retry" hidden>Coba Kamera Lagi</button>
<script>
'use strict';
const v=document.getElementById('v'), statusEl=document.getElementById('status'), retry=document.getElementById('retry');
let stream=null, attempt=0;
const nonce=new URL(location.href).searchParams.get('nonce');
async function capture(){
 const id=++attempt;retry.hidden=true;
 if(!nonce||!/^([a-f0-9]{48})$/.test(nonce)||!window.opener){statusEl.textContent='Halaman ini hanya untuk ceklok melalui aplikasi absensi.';return;}
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Error('Kamera tidak tersedia di browser ini.');
  if(stream)stream.getTracks().forEach(t=>t.stop());
  statusEl.textContent='Mengaktifkan kamera depan…';
  const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}}});
  if(id!==attempt){s.getTracks().forEach(t=>t.stop());return;}
  stream=s;v.srcObject=s;await v.play();
  statusEl.textContent='Kamera aktif. Arahkan wajah. Mengambil foto dalam 3 detik…';
  await new Promise(r=>setTimeout(r,3000));
  if(id!==attempt)return;
  if(!v.videoWidth)throw Error('Kamera belum siap.');
  const canvas=document.createElement('canvas');canvas.width=640;canvas.height=Math.round(v.videoHeight*640/v.videoWidth);
  canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);
  const jpeg=canvas.toDataURL('image/jpeg',.72);
  // Kirim foto ke halaman pemanggil. Tidak ada unggahan/pemilihan file dari galeri.
  window.opener.postMessage({type:'SDN004_CAMERA_CAPTURE',nonce,image:jpeg},'*');
  statusEl.textContent='Foto terkirim ke aplikasi. Kembali ke halaman absensi.';
  stream.getTracks().forEach(t=>t.stop());stream=null;
  setTimeout(()=>window.close(),400);
 }catch(err){
   if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
   statusEl.textContent='Kamera belum dapat dibuka: '+(err?.message||String(err))+'. Periksa izin situs kamera ini.';
   retry.hidden=false;
 }
}
retry.addEventListener('click',capture);
window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());});
capture();
</script></main></body></html>
